name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code. Jobs can't push, comment or change settings.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r api/requirements-dev.txt
      - run: python -m pyflakes src tests && pytest  # pyflakes: nothing unused; pytest fails below 100% line+branch coverage
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run coverage && npm run build  # coverage fails below 100%
        working-directory: web

  infra:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci && npm run build
        working-directory: web
      - run: npm install -g aws-cdk && pip install -r infra/requirements.txt pytest pyflakes
      - run: python -m pyflakes stack.py app.py tests && pytest -q tests  # nothing unused; security settings + no dependency cycles
        working-directory: infra
      - run: cdk synth --quiet -c googleClientId=ci-placeholder.apps.googleusercontent.com
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: eu-west-2
